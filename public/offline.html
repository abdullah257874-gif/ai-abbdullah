<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · AI Smart Assistant</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0b1120;
        color: #f8fafc;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 20px;
        padding: 32px;
        text-align: center;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 12px;
      }
      p {
        color: #94a3b8;
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      button {
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        padding: 12px 24px;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are currently offline</h1>
      <p>
        AI Smart Assistant requires an active internet connection to generate new Gemini AI responses. Cached interface views remain available.
      </p>
      <p dir="rtl" lang="ur">آپ اس وقت آف لائن ہیں۔ براہ کرم اپنا انٹرنیٹ کنکشن چیک کریں۔</p>
      <button onclick="window.location.reload()">Try Reconnecting</button>
    </main>
  </body>
</html>
